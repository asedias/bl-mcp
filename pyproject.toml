[project]
name = "bl-mcp"
version = "0.4.0"
description = "MCP server for a live Blender: tools to build, measure, check and look at a model, not only to run raw bpy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "asedias" }]
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]
keywords = ["blender", "mcp", "3d", "gamedev"]

[project.urls]
Repository = "https://github.com/asedias/bl-mcp"

[project.scripts]
bl-mcp = "bl_mcp.server:main"
bl-mcp-find-blender = "bl_mcp.locate:main"
bl-mcp-install-addon = "bl_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bl_mcp"]
