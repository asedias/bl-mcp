name: check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python tests/check_recipes.py
      - run: uv run python -c "import asyncio; from bl_mcp import server; from bl_mcp.app import mcp; print(len(asyncio.run(mcp.list_tools())), 'tools')"
